<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{--foreground:#182132;--muted-foreground:#6b7587;--background:#f6f8fc;--card:#fff;--border:#dfe5ee;--ring:#7591eb;--primary:#3056cc;--primary-foreground:#fff;--success:#187d5a;--success-surface:#e3f4ed;--info:#315dd3;--radius:10px;--font-sans:system-ui}body{max-width:1000px;margin:45px auto;padding:0 24px;background:var(--background)} *{box-sizing:border-box} body{font:14px var(--font-sans,system-ui);color:var(--foreground)} button{font:inherit;cursor:pointer} .setup{padding:24px 0}.primary{background:var(--primary);color:var(--primary-foreground);border:0;border-radius:var(--radius);padding:12px 23px;font-weight:650}.primary:disabled{opacity:.65;cursor:default}.workspace{display:none}.title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:24px}.title h1{font-size:23px;margin:0;letter-spacing:-.03em}.badge{color:var(--success);background:var(--success-surface);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:650;white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:7px}.sectionhead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}.sectionhead h2{font-size:15px;margin:0}.note{color:var(--muted-foreground);font-size:12px}.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:27px}.zone{border:1px solid var(--border);background:var(--card);border-radius:var(--radius);padding:13px;text-align:left;color:var(--foreground);min-height:80px}.zone:hover{border-color:var(--ring)}.zone strong{display:block;font-size:13px}.status{display:block;color:var(--muted-foreground);font-size:12px;margin-top:7px}.running{color:var(--info)}.done{color:var(--success)}.feed{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}.row{padding:14px 16px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto;gap:6px 14px}.row:last-child{border-bottom:0}.filename{font-weight:650;overflow-wrap:anywhere}.path{color:var(--muted-foreground);font-size:12px;overflow-wrap:anywhere;grid-column:1/-1;line-height:1.5}.link{font-size:12px;color:var(--primary);text-decoration:underline;cursor:pointer}.file-status{font-size:12px;color:var(--success);white-space:nowrap}.empty{padding:25px;color:var(--muted-foreground);font-size:13px}.hint{margin-top:12px;color:var(--muted-foreground);font-size:12px}.install{margin:16px 0;color:var(--muted-foreground)} @media(max-width:500px){.zones{grid-template-columns:repeat(2,minmax(0,1fr))}.title h1{font-size:19px}.row{grid-template-columns:1fr}.path{grid-column:auto}}
</style></head><body><div id="setup" class="setup"><button class="primary" onclick="setup()" id="setupButton">Setup</button><p id="install" class="install" hidden>Installing everything needed...</p></div><main id="workspace" class="workspace"><div class="title"><h1>DocuSign CLM</h1><span class="badge"><span class="dot"></span>Service ready to run</span></div><div class="sectionhead"><h2>Zones</h2><span class="note">Select a zone to start</span></div><div id="zones" class="zones"></div><div class="sectionhead"><h2>File activity</h2><span class="note">Latest activity first</span></div><div id="feed" class="feed"><div class="empty">Processed files will appear here.</div></div><p class="hint">Demo only. Names and activity are examples; no files or services are changed.</p></main><script>
const names=['Zona Sur','Zona Norte','Zona Centro','Zona Este','Zona Oeste','Zona Canarias'];
const clients=[['Industrias Lacteas de Granada','136555'],['Ence Energia Extremadura','175172'],['Avanti Motors','172615'],['Coagener Soluciones Tecnicas','171418'],['Atlantica Energia Sostenible','190414'],['Instalaciones Negratin','167212']];
let count=0; let timer;
function setup(){const b=document.getElementById('setupButton');b.disabled=true;document.getElementById('install').hidden=false;setTimeout(()=>{document.getElementById('setup').style.display='none';document.getElementById('workspace').style.display='block';draw();timer=setInterval(addActivity,12000)},1200)}
function draw(){document.getElementById('zones').innerHTML=names.map((n,i)=>`<button class="zone" id="zone${i}" onclick="run(${i})"><strong>${n}</strong><span class="status">Ready to start</span></button>`).join('')}
function addActivity(){const active=names.filter((_,i)=>document.getElementById('zone'+i).dataset.running==='true');if(!active.length)return;const zone=active[Math.floor(Math.random()*active.length)];const client=clients[Math.floor(Math.random()*clients.length)];const file=`Contrato_${client[0].replaceAll(' ','_')}_${client[1]}.pdf`;const feed=document.getElementById('feed');if(!count)feed.innerHTML='';count++;const row=document.createElement('div');row.className='row';row.dataset.zone=zone;row.innerHTML=`<div class="filename">${file}</div><span class="file-status running">Processing</span><div class="path">CLIENTS / SPAIN / ${zone} / ${client[1]} - ${client[0]}<br><span class="link">https://eu21.springcm.com/atlas/Documents/View?Id=example-${count}</span></div>`;feed.prepend(row)}
function run(i){let button=document.getElementById('zone'+i);if(button.disabled)return;button.disabled=true;button.dataset.running='true';button.querySelector('.status').className='status running';button.querySelector('.status').textContent='Processing...';setTimeout(()=>{button.querySelector('.status').className='status done';button.querySelector('.status').textContent='ZONE PROCESSED';button.disabled=false;button.dataset.running='false';document.querySelectorAll('.row').forEach(row=>{if(row.dataset.zone===names[i]){const tag=row.querySelector('.file-status');tag.textContent='Processed';tag.classList.remove('running')}})},24000)}
</script></body></html>
